<style>
    /* BUTTON SYSTEM - Shadcn Inspired */

    /* Base Button Styles */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-weight: 500;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        font-size: 0.875rem;
        position: relative;
        overflow: hidden;
        white-space: nowrap;
    }

    /* SIZES */
    .btn-sm {
        padding: 0.375rem 0.75rem;
        font-size: 0.8125rem;
    }

    .btn-md {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
    }

    .btn-lg {
        padding: 0.625rem 1.5rem;
        font-size: 0.9375rem;
    }

    .btn-xl {
        padding: 0.75rem 2rem;
        font-size: 1rem;
    }

    /* PRIMARY BUTTON */
    .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        transform: translateY(-2px);
    }

    .btn-primary:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .btn-primary.ghost {
        background: transparent;
        color: #3b82f6;
        border: 1px solid #3b82f6;
        box-shadow: none;
    }

    .btn-primary.ghost:hover {
        background: rgba(59, 130, 246, 0.1);
        box-shadow: none;
    }

    .btn-primary.outline {
        background: transparent;
        color: #3b82f6;
        border: 1px solid #3b82f6;
        box-shadow: none;
    }

    .btn-primary.outline:hover {
        background: rgba(59, 130, 246, 0.05);
        border-color: #2563eb;
    }

    /* SECONDARY BUTTON */
    .btn-secondary {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 1px solid var(--border);
    }

    .btn-secondary:hover {
        background: var(--bg-tertiary);
        border-color: #3b82f6;
    }

    .btn-secondary:active {
        transform: translateY(0);
    }

    .btn-secondary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* DANGER BUTTON */
    .btn-danger {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        transform: translateY(-2px);
    }

    .btn-danger:active {
        transform: translateY(0);
    }

    .btn-danger:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .btn-danger.ghost {
        background: transparent;
        color: #ef4444;
        border: 1px solid #ef4444;
        box-shadow: none;
    }

    .btn-danger.ghost:hover {
        background: rgba(239, 68, 68, 0.1);
    }

    /* SUCCESS BUTTON */
    .btn-success {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-success:hover {
        background: linear-gradient(135deg, #059669, #047857);
        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        transform: translateY(-2px);
    }

    .btn-success:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* WARNING BUTTON */
    .btn-warning {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .btn-warning:hover {
        background: linear-gradient(135deg, #d97706, #b45309);
        box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
        transform: translateY(-2px);
    }

    .btn-warning:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* LOADING STATE */
    .btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .btn.loading::after {
        content: '';
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* ICON BUTTONS */
    .btn-icon {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 0.5rem;
    }

    .btn-icon-sm {
        width: 28px;
        height: 28px;
    }

    .btn-icon-lg {
        width: 40px;
        height: 40px;
    }

    /* BLOCK BUTTON */
    .btn-block {
        width: 100%;
    }

    /* BUTTON GROUPS */
    .btn-group {
        display: inline-flex;
        border-radius: 0.5rem;
        overflow: hidden;
        border: 1px solid var(--border);
    }

    .btn-group .btn {
        border-radius: 0;
        border: none;
        border-right: 1px solid var(--border);
    }

    .btn-group .btn:last-child {
        border-right: none;
    }

    /* DARK MODE */
    @media (prefers-color-scheme: dark) {
        .btn-secondary {
            background: var(--bg-secondary);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
            border-color: #3b82f6;
        }
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
        .btn-lg,
        .btn-xl {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
    }
</style>

<!-- BUTTON COMPONENT EXAMPLES -->
<template id="button-examples">
    <!-- Primary Buttons -->
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary btn-md">Medium</button>
    <button class="btn btn-primary btn-lg">Large</button>
    <button class="btn btn-primary btn-xl">Extra Large</button>

    <!-- With Icon -->
    <button class="btn btn-primary btn-md">
        <i class="bi bi-plus"></i>
        Add Item
    </button>

    <!-- Loading State -->
    <button class="btn btn-primary btn-md loading" disabled>
        <span>Saving...</span>
    </button>

    <!-- Secondary Buttons -->
    <button class="btn btn-secondary btn-md">Secondary</button>

    <!-- Danger Buttons -->
    <button class="btn btn-danger btn-md">Delete</button>
    <button class="btn btn-danger btn-md ghost">Delete</button>

    <!-- Success Buttons -->
    <button class="btn btn-success btn-md">Save</button>

    <!-- Icon Button -->
    <button class="btn btn-primary btn-icon" title="Edit">
        <i class="bi bi-pencil"></i>
    </button>

    <!-- Block Button -->
    <button class="btn btn-primary btn-block btn-md">Full Width</button>

    <!-- Button Group -->
    <div class="btn-group">
        <button class="btn btn-secondary btn-md">Previous</button>
        <button class="btn btn-secondary btn-md">Next</button>
    </div>
</template>
