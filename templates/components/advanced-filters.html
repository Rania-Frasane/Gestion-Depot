<style>
    /* ADVANCED FILTER STYLES */
    .filter-panel {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .filter-panel h3 {
        font-size: 0.875rem;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 1rem;
        letter-spacing: 0.05em;
    }

    .filter-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .filter-input {
        position: relative;
    }

    .filter-input label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
    }

    .filter-input input,
    .filter-input select {
        width: 100%;
        padding: 0.625rem 0.75rem;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        color: var(--text-primary);
        font-size: 0.875rem;
        transition: all 0.2s ease;
    }

    .filter-input input:focus,
    .filter-input select:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .filter-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
        flex-wrap: wrap;
    }

    .filter-actions .btn {
        flex: 1;
        min-width: 100px;
    }

    /* DATE RANGE PICKER */
    .date-range {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 0.75rem;
        align-items: end;
    }

    .date-range-label {
        grid-column: 1 / -1;
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
    }

    .date-range-separator {
        color: var(--text-secondary);
        font-weight: 500;
    }

    .date-range input {
        padding: 0.625rem 0.75rem;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        color: var(--text-primary);
        font-size: 0.875rem;
        cursor: pointer;
    }

    /* FILTER TAGS */
    .filter-tags {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 1rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        margin-bottom: 1rem;
    }

    .filter-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.75rem;
        background: #3b82f6;
        color: white;
        border-radius: 999px;
        font-size: 0.875rem;
        animation: slideUp 0.2s ease-out;
    }

    .filter-tag button {
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 0;
        font-size: 0.875rem;
        opacity: 0.8;
        transition: opacity 0.2s ease;
    }

    .filter-tag button:hover {
        opacity: 1;
    }

    /* FILTER DROPDOWN */
    .filter-dropdown {
        position: relative;
        display: inline-block;
    }

    .filter-dropdown-btn {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        color: var(--text-primary);
        cursor: pointer;
        font-size: 0.875rem;
        transition: all 0.2s ease;
    }

    .filter-dropdown-btn:hover {
        border-color: #3b82f6;
        background: var(--bg-tertiary);
    }

    .filter-dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 0.5rem;
        min-width: 200px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-4px);
        transition: all 0.2s ease;
        z-index: 40;
    }

    .filter-dropdown.active .filter-dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .filter-dropdown-menu a,
    .filter-dropdown-menu button {
        display: block;
        width: 100%;
        padding: 0.75rem 1rem;
        text-align: left;
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        font-size: 0.875rem;
        transition: background-color 0.2s ease;
        text-decoration: none;
    }

    .filter-dropdown-menu a:hover,
    .filter-dropdown-menu button:hover {
        background-color: var(--bg-secondary);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .filter-group {
            grid-template-columns: 1fr;
        }

        .filter-actions {
            flex-direction: column;
        }

        .filter-actions .btn {
            width: 100%;
        }

        .date-range {
            grid-template-columns: 1fr;
        }

        .date-range-separator {
            display: none;
        }
    }
</style>

<!-- FILTER COMPONENT TEMPLATE -->
<template id="advanced-filter-template">
    <div class="filter-panel">
        <h3>Filtres avancés</h3>
        <form id="advancedFilterForm" class="space-y-4">
            
            <!-- Basic Filters -->
            <div class="filter-group">
                <!-- Search input (will be replaced with actual filters) -->
                <div class="filter-input">
                    <label for="search">Recherche</label>
                    <input type="text" id="search" name="search" placeholder="Rechercher...">
                </div>
            </div>

            <!-- Actions -->
            <div class="filter-actions">
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-search"></i> Appliquer
                </button>
                <button type="reset" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-clockwise"></i> Réinitialiser
                </button>
            </div>
        </form>
    </div>

    <!-- Active Filters Tags -->
    <div id="activeFilterTags" class="filter-tags" style="display: none;">
        <!-- Filter tags will be added here dynamically -->
    </div>
</template>

<!-- FILTER JAVASCRIPT -->
<script>
    class AdvancedFilter {
        constructor(formId, tableId) {
            this.form = document.getElementById(formId);
            this.table = document.getElementById(tableId);
            this.filters = {};
            this.init();
        }

        init() {
            if (this.form) {
                this.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.applyFilters();
                });

                this.form.addEventListener('reset', () => {
                    this.clearFilters();
                });
            }
        }

        applyFilters() {
            const formData = new FormData(this.form);
            this.filters = Object.fromEntries(formData);
            this.filterTable();
            this.updateFilterTags();
        }

        filterTable() {
            if (!this.table) return;

            const rows = this.table.querySelectorAll('tbody tr');
            let visibleCount = 0;

            rows.forEach(row => {
                let matches = true;

                for (const [key, value] of Object.entries(this.filters)) {
                    if (!value) continue;

                    const cell = row.querySelector(`[data-filter="${key}"]`);
                    if (cell) {
                        const cellText = cell.textContent.toLowerCase();
                        const filterValue = value.toLowerCase();

                        if (!cellText.includes(filterValue)) {
                            matches = false;
                            break;
                        }
                    }
                }

                if (matches) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            // Show empty state if no rows match
            const emptyState = this.table.nextElementSibling;
            if (emptyState && emptyState.classList.contains('empty-state')) {
                emptyState.style.display = visibleCount === 0 ? 'flex' : 'none';
            }
        }

        updateFilterTags() {
            const tagsContainer = document.getElementById('activeFilterTags');
            if (!tagsContainer) return;

            tagsContainer.innerHTML = '';
            let hasFilters = false;

            for (const [key, value] of Object.entries(this.filters)) {
                if (value) {
                    hasFilters = true;
                    const tag = document.createElement('div');
                    tag.className = 'filter-tag';
                    tag.innerHTML = `
                        <span>${key}: <strong>${value}</strong></span>
                        <button type="button" onclick="this.parentElement.remove()">×</button>
                    `;
                    tagsContainer.appendChild(tag);
                }
            }

            tagsContainer.style.display = hasFilters ? 'flex' : 'none';
        }

        clearFilters() {
            this.filters = {};
            const rows = this.table.querySelectorAll('tbody tr');
            rows.forEach(row => row.style.display = '');
            this.updateFilterTags();
        }

        addFilter(key, value) {
            this.filters[key] = value;
            this.filterTable();
            this.updateFilterTags();
        }

        removeFilter(key) {
            delete this.filters[key];
            this.filterTable();
            this.updateFilterTags();
        }

        getFilterState() {
            return { ...this.filters };
        }
    }

    // Export for global use
    window.AdvancedFilter = AdvancedFilter;
</script>
