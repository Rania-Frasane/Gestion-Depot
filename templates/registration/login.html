<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — Dépôt Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{border:none;border-radius:14px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 25px 60px rgba(0,0,0,.4)}
.brand{font-weight:700;font-size:1.3rem;color:#0f172a}
</style>
</head>
<body>
<div class="card">
  <div class="text-center mb-4">
    <div class="brand">📦 Dépôt Manager</div>
    <p class="text-muted small mt-1">Connectez-vous pour continuer</p>
  </div>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger py-2 small">Identifiants incorrects.</div>{% endif %}
    <div class="mb-3">
      <label class="form-label small fw-semibold">Nom d'utilisateur</label>
      <input type="text" name="username" class="form-control" autofocus required>
    </div>
    <div class="mb-4">
      <label class="form-label small fw-semibold">Mot de passe</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-dark w-100 fw-semibold">Se connecter</button>
  </form>
</div>
</body>
</html>
