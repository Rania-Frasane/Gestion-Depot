<!-- MODAL BASE TEMPLATE -->
<!-- Usage: {% include "components/modal_base.html" with modal_id="myModal" modal_title="Form Title" modal_content_template="path/to/content.html" %} -->

<div id="{{ modal_id }}" class="modal-overlay">
    <div class="modal-content">
        <!-- Header -->
        <div class="modal-header">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white">
                {{ modal_title }}
            </h2>
            <button type="button" 
                    onclick="modalManager.close('{{ modal_id }}')"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-2xl leading-none">
                &times;
            </button>
        </div>

        <!-- Body -->
        <div class="modal-body">
            {% if modal_content_template %}
                {% include modal_content_template %}
            {% else %}
                {{ modal_content|safe }}
            {% endif %}
        </div>
    </div>
</div>
