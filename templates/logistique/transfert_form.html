{% extends "core/base.html" %}

{% block title %}Nouveau Transfert | Dépôt Manager{% endblock %}
{% block page_title %}Créer un Nouveau Transfert de Stock{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Entrepôt Source</label>
                        <select name="entrepot_source" class="form-select" required>
                            <option value="">Sélectionner source...</option>
                            {% for ent in entrepots %}
                            <option value="{{ ent.id }}">{{ ent.nom }} ({{ ent.ville }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Entrepôt Destination</label>
                        <select name="entrepot_destination" class="form-select" required>
                            <option value="">Sélectionner destination...</option>
                            {% for ent in entrepots %}
                            <option value="{{ ent.id }}">{{ ent.nom }} ({{ ent.ville }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Notes / Motif du transfert</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="Ex: Réapprovisionnement stock saisonnier..."></textarea>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2 fw-bold">
                            Créer le Brouillon <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                        <a href="{% url 'logistique:transfert_liste' %}" class="btn btn-light py-2">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
