<!-- CONFIRMATION MODAL TEMPLATE -->
<!-- Usage: {% include "components/modal_confirm.html" with modal_id="confirmModal" title="Confirm Action" message="Are you sure?" confirm_url="/path/to/action" confirm_text="Delete" is_danger=True %} -->

<div id="{{ modal_id }}" class="modal-overlay">
    <div class="modal-content">
        <!-- Header -->
        <div class="modal-header">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white">
                {{ title }}
            </h2>
            <button type="button" 
                    onclick="modalManager.close('{{ modal_id }}')"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-2xl leading-none">
                &times;
            </button>
        </div>

        <!-- Body -->
        <div class="modal-body">
            <p class="text-gray-600 dark:text-gray-300 text-base">
                {{ message }}
            </p>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
            <button type="button" 
                    onclick="modalManager.close('{{ modal_id }}')"
                    class="btn-secondary">
                Annuler
            </button>
            <a href="{{ confirm_url }}" 
               class="{% if is_danger %}btn-danger{% else %}btn-primary{% endif %}">
                {{ confirm_text }}
            </a>
        </div>
    </div>
</div>
