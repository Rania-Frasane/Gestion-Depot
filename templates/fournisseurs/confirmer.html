{% extends 'core/base.html' %}
{% block title %}Archiver{% endblock %}{% block page_title %}Archiver fournisseur{% endblock %}
{% block content %}<div class="card border-danger" style="max-width:420px"><div class="card-body">
  <p class="text-muted">Archiver <strong>{{ obj.nom }}</strong> ?</p>
  <form method="post" class="d-flex gap-2">{% csrf_token %}
    <button type="submit" class="btn btn-danger btn-sm">Archiver</button>
    <a href="{% url 'fournisseurs:liste' %}" class="btn btn-outline-secondary btn-sm">Annuler</a>
  </form>
</div></div>{% endblock %}
