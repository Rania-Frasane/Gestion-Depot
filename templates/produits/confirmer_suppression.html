{% extends 'core/base.html' %}
{% block title %}Archiver produit{% endblock %}
{% block page_title %}Archiver produit{% endblock %}
{% block content %}
<div class="card border-danger" style="max-width:420px">
  <div class="card-body">
    <h6 class="fw-semibold mb-2">Confirmer l'archivage</h6>
    <p class="text-muted">Voulez-vous archiver <strong>{{ produit.nom }}</strong> ({{ produit.code }}) ?</p>
    <form method="post" class="d-flex gap-2">{% csrf_token %}
      <button type="submit" class="btn btn-danger btn-sm">Archiver</button>
      <a href="{% url 'produits:liste' %}" class="btn btn-outline-secondary btn-sm">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
